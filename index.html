

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10243a">
<title>RISKORA Grant Control</title>
<style>
:root{
 --navy:#10243a;--blue:#2563eb;--bg:#f3f6fb;
 --line:#dfe6ef;--muted:#64748b;--red:#b91c1c;
 --green:#047857;--orange:#c2410c;--white:#fff
}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#18283d}
header{background:var(--navy);color:white;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:25px;letter-spacing:2px}
header p{margin:6px 0 0;color:#cbd5e1}
.layout{display:flex;min-height:calc(100vh - 85px)}
nav{width:225px;flex-shrink:0;background:white;border-right:1px solid var(--line);padding:12px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;border:0}
nav button.active,nav button:hover{background:#e8efff;color:var(--blue)}
main{padding:22px;flex:1;min-width:0}
h2{margin-top:0}
h3{margin-top:0}
button,input,select,textarea{font:inherit;border-radius:8px;padding:10px;border:1px solid var(--line)}
button{cursor:pointer;background:white;color:var(--navy)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{display:block;width:100%;margin:5px 0 12px;background:white}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:bold;font-size:13px;margin-top:10px}
.primary{background:var(--blue);color:white;border:0}
.danger{color:var(--red)}
.layout-buttons{display:flex;gap:7px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:15px;min-width:0}
.metric{font-size:23px;font-weight:bold;margin-top:12px;overflow-wrap:anywhere}
.muted,small{color:var(--muted);font-size:12px}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:9px;font-size:13px;margin-bottom:15px}
.success{background:#ecfdf5;border:1px solid #a7f3d0;padding:10px;border-radius:8px}
.pill{display:inline-block;background:#e0f2fe;color:#075985;padding:4px 8px;border-radius:20px;font-size:12px}
.pill.red{background:#fee2e2;color:#991b1b}
.pill.green{background:#d1fae5;color:#065f46}
.pill.orange{background:#ffedd5;color:#9a3412}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:white;min-width:650px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8fafc}
.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:var(--blue)}
.search{max-width:450px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:700px){
 .layout{display:block}
 nav{width:100%;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
 nav button{white-space:nowrap;width:auto;flex-shrink:0}
 main{padding:13px}
 header{padding:15px}
 .metric{font-size:20px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <div>
   <h1>RISKORA</h1>
   <p id="tagline">GRANT CONTROL · Gestion des subventions</p>
  </div>
  <button onclick="toggleLang()" id="langBtn">EN</button>
 </div>
</header>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>

<script>
"use strict";

const T={
fr:{
 dashboard:"Tableau de bord",grants:"Bailleurs & subventions",
 budgets:"Budgets",expenses:"Dépenses",compliance:"Conformité",
 overview:"Vue d’ensemble",active:"Subventions",
 totalBudget:"Budget approuvé",spent:"Dépenses enregistrées",
 balance:"Solde budgétaire",recent:"Subventions enregistrées",
 newGrant:"Ajouter une subvention",grant:"Nom de la subvention",
 donor:"Bailleur",project:"Projet",currency:"Devise",
 amount:"Montant approuvé",start:"Date de début",end:"Date de fin",
 save:"Enregistrer",cancel:"Annuler",status:"Statut",actions:"Actions",
 empty:"Aucune donnée enregistrée.",budgetTitle:"Suivi budgétaire",
 grantSelect:"Subvention",line:"Ligne budgétaire",
 allocated:"Budget de la ligne",expenseTitle:"Enregistrer une dépense",
 date:"Date",category:"Catégorie",value:"Montant",
 reference:"Référence du justificatif",addExpense:"Enregistrer la dépense",
 expenseList:"Dépenses enregistrées",complianceTitle:"Conformité des bailleurs",
 requirement:"Exigence ou rapport",due:"Date limite",
 addRequirement:"Ajouter une exigence",requirements:"Échéances enregistrées",
 pending:"À suivre",edit:"Modifier",delete:"Supprimer",
 confirmDelete:"Confirmer la suppression de cet élément ?",
 noGrant:"Créez d’abord une subvention.",all:"Toutes",
 remaining:"Disponible",used:"Utilisé",usage:"Consommation budgétaire",
 note:"Prototype de démonstration : n’utilisez pas de données confidentielles.",
 required:"Veuillez remplir les champs obligatoires.",
 over:"Attention : dépassement du budget.",
 donorReport:"Rapport bailleur",documents:"Justificatifs",
 other:"Autre",activeStatus:"Active",closed:"Clôturée",
 late:"En retard",upcoming:"À venir",completed:"Terminé",
 search:"Rechercher",allStatuses:"Tous les statuts",
 export:"Exporter les données CSV",noBudget:"Aucune ligne budgétaire.",
 budgetLine:"Ligne budgétaire",addLine:"Ajouter une ligne budgétaire",
 lineName:"Libellé de la ligne",deleteLine:"Supprimer la ligne",
 budgetExceeded:"Cette dépense dépasse le budget disponible. Continuer ?",
 dateError:"La date de fin doit être après la date de début.",
 grantError:"Cette subvention possède des dépenses ou des lignes budgétaires. Supprimez d’abord les éléments liés.",
 noResults:"Aucun résultat trouvé.",notes:"Notes",
 dueSoon:"Échéances à suivre",complianceState:"État de conformité",
 grantSaved:"Subvention enregistrée.",expenseSaved:"Dépense enregistrée.",
 requirementSaved:"Exigence enregistrée.",exportDone:"Export prêt.",
 currencyWarning:"Les montants en différentes devises ne doivent pas être additionnés sans conversion.",
 description:"Description",referenceRequired:"Référence"
},
en:{
 dashboard:"Dashboard",grants:"Donors & grants",budgets:"Budgets",
 expenses:"Expenses",compliance:"Compliance",overview:"Overview",
 active:"Grants",totalBudget:"Approved budget",spent:"Recorded expenses",
 balance:"Budget balance",recent:"Registered grants",newGrant:"Add a grant",
 grant:"Grant name",donor:"Donor",project:"Project",currency:"Currency",
 amount:"Approved amount",start:"Start date",end:"End date",save:"Save",
 cancel:"Cancel",status:"Status",actions:"Actions",empty:"No data recorded.",
 budgetTitle:"Budget tracking",grantSelect:"Grant",line:"Budget line",
 allocated:"Line budget",expenseTitle:"Record an expense",date:"Date",
 category:"Category",value:"Amount",reference:"Supporting document reference",
 addExpense:"Record expense",expenseList:"Recorded expenses",
 complianceTitle:"Donor compliance",requirement:"Requirement or report",
 due:"Due date",addRequirement:"Add requirement",requirements:"Deadlines",
 pending:"Pending",edit:"Edit",delete:"Delete",
 confirmDelete:"Confirm deletion of this item?",noGrant:"Create a grant first.",
 all:"All",remaining:"Available",used:"Used",usage:"Budget consumption",
 note:"Demonstration prototype: do not use confidential data.",
 required:"Please fill in the required fields.",
 over:"Warning: budget exceeded.",donorReport:"Donor report",
 documents:"Supporting documents",other:"Other",activeStatus:"Active",
 closed:"Closed",late:"Overdue",upcoming:"Upcoming",completed:"Completed",
 search:"Search",allStatuses:"All statuses",export:"Export data as CSV",
 noBudget:"No budget lines.",budgetLine:"Budget line",
 addLine:"Add budget line",lineName:"Line name",deleteLine:"Delete line",
 budgetExceeded:"This expense exceeds the available budget. Continue?",
 dateError:"The end date must be after the start date.",
 grantError:"This grant has expenses or budget lines. Delete linked items first.",
 noResults:"No results found.",notes:"Notes",dueSoon:"Deadlines to follow",
 complianceState:"Compliance status",grantSaved:"Grant saved.",
 expenseSaved:"Expense saved.",requirementSaved:"Requirement saved.",
 exportDone:"Export ready.",currencyWarning:"Amounts in different currencies must not be added without conversion.",
 description:"Description",referenceRequired:"Reference"
}
};

let lang="fr",page="dashboard";
let grants=[],expenses=[],requirements=[],budgetLines=[];
let searchText="";

const t=k=>T[lang][k]||k;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function money(n,c="USD"){
 try{return new Intl.NumberFormat(lang==="fr"?"fr-FR":"en-US",
 {style:"currency",currency:c,maximumFractionDigits:2}).format(Number(n)||0)}
 catch{return (Number(n)||0).toFixed(2)+" "+c}
}
function fmtDate(s){
 if(!s)return "—";
 const d=new Date(s+"T00:00:00");
 return isNaN(d) ? esc(s):d.toLocaleDateString(lang==="fr"?"fr-FR":"en-US");
}
function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function totalBudget(){
 return grants.reduce((s,g)=>s+Number(g.amount||0),0);
}
function totalSpent(){
 return expenses.reduce((s,e)=>s+Number(e.amount||0),0);
}
function spentFor(id){
 return expenses.filter(e=>e.grantId===id).reduce((s,e)=>s+Number(e.amount||0),0);
}
function grantName(id){return grants.find(g=>g.id===id)?.name||"—";}
function grantCurrency(id){return grants.find(g=>g.id===id)?.currency||"USD";}
function lineSpent(id){
 return expenses.filter(e=>e.budgetLineId===id).reduce((s,e)=>s+Number(e.amount||0),0);
}
function lineRemaining(id){
 const l=budgetLines.find(x=>x.id===id);
 return l?Number(l.amount)-lineSpent(id):0;
}
function toggleLang(){lang=lang==="fr"?"en":"fr";render();}
function go(p){page=p;searchText="";render();}
function notify(msg){alert(msg);}
function nav(){
 const items=["dashboard","grants","budgets","expenses","compliance"];
 document.getElementById("nav").innerHTML=items.map(p=>
 `<button class="${page===p?"active":""}" onclick="go('${p}')">${t(p)}</button>`
 ).join("");
}
function grantOptions(selected=""){
 return grants.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?"selected":""}>${esc(g.name)} — ${esc(g.donor)}</option>`).join("");
}
function statusPill(label,kind=""){
 return `<span class="pill ${kind}">${esc(label)}</span>`;
}
function searchBox(){
 return `<input class="search" id="searchInput" placeholder="${t("search")}" value="${esc(searchText)}" oninput="searchText=this.value;refreshSearch()">`;
}
function refreshSearch(){
 const el=document.getElementById("searchResults");
 if(el)el.innerHTML=currentSearchResults();
}
function currentSearchResults(){
 const q=searchText.toLowerCase().trim();
 const list=grants.filter(g=>[g.name,g.donor,g.project,g.status].join(" ").toLowerCase().includes(q));
 return grantTable(list);
}

function dashboard(){
 const currencies=[...new Set(grants.map(g=>g.currency||"USD"))];
 const metrics=currencies.length<=1;
 const currency=currencies[0]||"USD";
 const budget=totalBudget(),spent=totalSpent();
 const upcoming=requirements.filter(r=>r.status!==t("completed")&&r.status!=="Terminé"&&r.status!=="Completed")
 .filter(r=>r.due&&r.due<=today()).length;
 return `<h2>${t("overview")}</h2>
 <div class="notice">${t("note")}<br>${t("currencyWarning")}<br>
 <strong>Info :</strong> données stockées dans ce navigateur uniquement.</div>
 <div class="grid">
  <div class="card">${t("active")}<div class="metric">${grants.length}</div></div>
  <div class="card">${t("totalBudget")}<div class="metric">${metrics?money(budget,currency):currencies.length+" devises"}</div></div>
  <div class="card">${t("spent")}<div class="metric">${metrics?money(spent,currency):currencies.length+" devises"}</div></div>
  <div class="card">${t("balance")}<div class="metric">${metrics?money(budget-spent,currency):"—"}</div></div>
 </div>
 <div class="card"><h3>${t("recent")}</h3>${grantTable(grants.slice(0,8))}</div>
 <div class="card"><h3>${t("usage")}</h3>
 <p>${budget>0?Math.round(spent/budget*100):0}%</p>
 <div class="progress"><span style="width:${budget?Math.min(100,Math.max(0,spent/budget*100)):0}%"></span></div>
 ${spent>budget?`<p>${statusPill(t("over"),"red")}</p>`:""}
 <p>${t("dueSoon")}: <strong>${upcoming}</strong></p></div>`;
}
function grantTable(list=grants){
 if(!list.length)return `<p>${t("empty")}</p>`;
 return `<div class="tablewrap"><table><thead><tr>
 <th>${t("grant")}</th><th>${t("donor")}</th><th>${t("amount")}</th>
 <th>${t("start")} / ${t("end")}</th><th>${t("status")}</th><th>${t("actions")}</th>
 </tr></thead><tbody>${list.map(g=>`<tr>
 <td><strong>${esc(g.name)}</strong><br><small>${esc(g.project)}</small></td>
 <td>${esc(g.donor)}</td><td>${money(g.amount,g.currency)}</td>
 <td>${fmtDate(g.start)}<br>${fmtDate(g.end)}</td>
 <td>${statusPill(g.status,g.status===t("closed")||g.status==="Closed"?"orange":"green")}</td>
 <td><div class="layout-buttons">
 <button onclick="editGrant('${g.id}')">${t("edit")}</button>
 <button class="danger" onclick="removeItem('grant','${g.id}')">${t("delete")}</button>
 </div></td></tr>`).join("")}</tbody></table></div>`;
}
function grantPage(editId=""){
 const g=grants.find(x=>x.id===editId)||null;
 return `<h2>${t("grants")}</h2>
 <div class="card"><h3>${g?t("edit"):t("newGrant")}</h3>
 <form onsubmit="saveGrant(event,'${g?g.id:""}')">
 <label>${t("grant")} *</label><input id="gname" value="${esc(g?.name||"")}" required>
 <label>${t("donor")} *</label><input id="gdonor" value="${esc(g?.donor||"")}" required>
 <label>${t("project")}</label><input id="gproject" value="${esc(g?.project||"")}">
 <label>${t("amount")} *</label><input id="gamount" type="number" min="0" step=".01" value="${g?.amount??""}" required>
 <label>${t("currency")}</label><select id="gcurrency">${["USD","HTG","EUR","CAD","GBP"].map(c=>`<option ${g?.currency===c?"selected":""}>${c}</option>`).join("")}</select>
 <label>${t("start")}</label><input id="gstart" type="date" value="${g?.start||""}">
 <label>${t("end")}</label><input id="gend" type="date" value="${g?.end||""}">
 <label>${t("status")}</label><select id="gstatus">
 <option value="active" ${!g||g.status==="active"?"selected":""}>${t("activeStatus")}</option>
 <option value="closed" ${g?.status==="closed"?"selected":""}>${t("closed")}</option></select>
 <label>${t("notes")}</label><textarea id="gnotes">${esc(g?.notes||"")}</textarea>
 <div class="layout-buttons"><button class="primary">${t("save")}</button><button type="button" onclick="go('grants')">${t("cancel")}</button></div>
 </form></div>
 <div class="card"><h3>${t("recent")}</h3>${searchBox()}<div id="searchResults">${currentSearchResults()}</div></div>`;
}
function saveGrant(e,id){
 e.preventDefault();
 const start=document.getElementById("gstart").value;
 const end=document.getElementById("gend").value;
 if(start&&end&&end<start){notify(t("dateError"));return;}
 const old=grants.find(g=>g.id===id);
 const item={
 id:id||uid(),name:document.getElementById("gname").value.trim(),
 donor:document.getElementById("gdonor").value.trim(),
 project:document.getElementById("gproject").value.trim(),
 amount:Number(document.getElementById("gamount").value),
 currency:document.getElementById("gcurrency").value,start,end,
 status:document.getElementById("gstatus").value,
 notes:document.getElementById("gnotes").value.trim()
 };
 if(old)Object.assign(old,item);else grants.push(item);
 persist();go("grants");notify(t("grantSaved"));
}
function editGrant(id){document.getElementById("main").innerHTML=grantPage(id);}
function budgetPage(){
 const form=grants.length?`<div class="card"><h3>${t("addLine")}</h3>
 <form onsubmit="addBudgetLine(event)">
 <label>${t("grantSelect")} *</label><select id="blGrant" required>${grantOptions()}</select>
 <label>${t("lineName")} *</label><input id="blName" required>
 <label>${t("allocated")} *</label><input id="blAmount" type="number" min="0" step=".01" required>
 <button class="primary">${t("addLine")}</button></form></div>`:`<div class="card">${t("noGrant")}</div>`;
 const rows=budgetLines.map(l=>`<tr>
 <td>${esc(grantName(l.grantId))}</td><td>${esc(l.name)}</td>
 <td>${money(l.amount,l.currency)}</td><td>${money(lineSpent(l.id),l.currency)}</td>
 <td>${money(lineRemaining(l.id),l.currency)}</td>
 <td>${Number(l.amount)>0?Math.round(lineSpent(l.id)/Number(l.amount)*100):0}%</td>
 <td><button class="danger" onclick="removeBudgetLine('${l.id}')">${t("deleteLine")}</button></td>
 </tr>`).join("");
 return `<h2>${t("budgetTitle")}</h2>${form}
 <div class="card"><div class="tablewrap"><table><thead><tr>
 <th>${t("grant")}</th><th>${t("lineName")}</th><th>${t("allocated")}</th>
 <th>${t("spent")}</th><th>${t("remaining")}</th><th>${t("usage")}</th><th>${t("actions")}</th>
 </tr></thead><tbody>${rows||`<tr><td colspan="7">${t("noBudget")}</td></tr>`}</tbody></table></div></div>`;
}
function addBudgetLine(e){
 e.preventDefault();
 const grantId=document.getElementById("blGrant").value;
 const name=document.getElementById("blName").value.trim();
 const amount=Number(document.getElementById("blAmount").value);
 if(!grantId||!name||!Number.isFinite(amount)||amount<0){notify(t("required"));return;}
 budgetLines.push({id:uid(),grantId,name,amount,currency:grantCurrency(grantId)});
 persist();go("budgets");
}
function removeBudgetLine(id){
 if(expenses.some(e=>e.budgetLineId===id)){notify(t("grantError"));return;}
 if(!confirm(t("confirmDelete")))return;
 budgetLines=budgetLines.filter(l=>l.id!==id);persist();go("budgets");
}
function expensePage(){
 return `<h2>${t("expenses")}</h2>
 <div class="card"><h3>${t("expenseTitle")}</h3>
 ${grants.length?`<form onsubmit="saveExpense(event)">
 <label>${t("grantSelect")} *</label><select id="egrant" required>${grantOptions()}</select>
 <label>${t("date")} *</label><input id="edate" type="date" value="${today()}" required>
 <label>${t("category")} *</label><input id="ecat" required>
 <label>${t("value")} *</label><input id="eamount" type="number" min=".01" step=".01" required>
 <label>${t("reference")}</label><input id="eref">
 <label>${t("budgetLine")}</label><select id="ebudget"><option value="">—</option></select>
 <button class="primary">${t("addExpense")}</button></form>`:t("noGrant")}
 </div><div class="card"><h3>${t("expenseList")}</h3>${expenseTable()}</div>`;
}
function updateExpenseBudgetOptions(){
 const grantId=document.getElementById("egrant")?.value;
 const select=document.getElementById("ebudget");if(!select)return;
 select.innerHTML='<option value="">—</option>'+budgetLines.filter(l=>l.grantId===grantId)
 .map(l=>`<option value="${l.id}">${esc(l.name)} — ${money(lineRemaining(l.id),l.currency)}</option>`).join("");
}
function expenseTable(){
 if(!expenses.length)return `<p>${t("empty")}</p>`;
 return `<div class="tablewrap"><table><thead><tr>
 <th>${t("grant")}</th><th>${t("date")}</th><th>${t("category")}</th>
 <th>${t("value")}</th><th>${t("reference")}</th><th>${t("actions")}</th>
 </tr></thead><tbody>${expenses.map(e=>`<tr>
 <td>${esc(grantName(e.grantId))}</td><td>${fmtDate(e.date)}</td><td>${esc(e.category)}</td>
 <td>${money(e.amount,grantCurrency(e.grantId))}</td><td>${esc(e.reference)}</td>
 <td><button class="danger" onclick="removeItem('expense','${e.id}')">${t("delete")}</button></td>
 </tr>`).join("")}</tbody></table></div>`;
}
function saveExpense(e){
 e.preventDefault();
 const grantId=document.getElementById("egrant").value;
 const budgetLineId=document.getElementById("ebudget").value;
 const amount=Number(document.getElementById("eamount").value);
 if(!Number.isFinite(amount)||amount<=0){notify(t("required"));return;}
 if(budgetLineId){
 const l=budgetLines.find(x=>x.id===budgetLineId);
 if(l&&amount>lineRemaining(l.id)&&!confirm(t("budgetExceeded")))return;
 }
 expenses.push({
 id:uid(),grantId,budgetLineId,date:document.getElementById("edate").value,
 category:document.getElementById("ecat").value.trim(),amount,
 reference:document.getElementById("eref").value.trim()
 });
 persist();go("expenses");notify(t("expenseSaved"));
}
function compliancePage(){
 return `<h2>${t("complianceTitle")}</h2>
 <div class="card"><form onsubmit="saveRequirement(event)">
 <label>${t("grantSelect")} *</label><select id="rgrant" required ${grants.length?"":"disabled"}>${grantOptions()}</select>
 <label>${t("requirement")} *</label><input id="rname" required>
 <label>${t("due")} *</label><input id="rdue" type="date" required>
 <label>${t("status")}</label><select id="rstatus">
 <option value="pending">${t("pending")}</option><option value="report">${t("donorReport")}</option>
 <option value="documents">${t("documents")}</option><option value="completed">${t("completed")}</option>
 </select>
 <label>${t("notes")}</label><textarea id="rnotes"></textarea>
 <button class="primary" ${grants.length?"":"disabled"}>${t("addRequirement")}</button>
 </form></div>
 <div class="card"><h3>${t("requirements")}</h3>${requirementTable()}</div>`;
}
function deadlineStatus(r){
 if(r.status==="completed"||r.status==="Terminé"||r.status==="Completed")return {label:t("completed"),kind:"green"};
 if(r.due<today())return {label:t("late"),kind:"red"};
 return {label:t("upcoming"),kind:"orange"};
}
function requirementTable(){
 if(!requirements.length)return `<p>${t("empty")}</p>`;
 return `<div class="tablewrap"><table><thead><tr>
 <th>${t("grant")}</th><th>${t("requirement")}</th><th>${t("due")}</th>
 <th>${t("status")}</th><th>${t("notes")}</th><th>${t("actions")}</th>
 </tr></thead><tbody>${requirements.map(r=>{
 const s=deadlineStatus(r);
 return `<tr><td>${esc(grantName(r.grantId))}</td><td>${esc(r.name)}</td>
 <td>${fmtDate(r.due)}</td><td>${statusPill(s.label,s.kind)}</td>
 <td>${esc(r.notes||"")}</td><td><div class="layout-buttons">
 <button onclick="toggleRequirement('${r.id}')">${r.status==="completed"?t("pending"):t("completed")}</button>
 <button class="danger" onclick="removeItem('requirement','${r.id}')">${t("delete")}</button>
 </div></td></tr>`;
 }).join("")}</tbody></table></div>`;
}
function saveRequirement(e){
 e.preventDefault();
 if(!grants.length){notify(t("noGrant"));return;}
 requirements.push({
 id:uid(),grantId:document.getElementById("rgrant").value,
 name:document.getElementById("rname").value.trim(),
 due:document.getElementById("rdue").value,
 status:document.getElementById("rstatus").value,
 notes:document.getElementById("rnotes").value.trim()
 });
 persist();go("compliance");notify(t("requirementSaved"));
}
function toggleRequirement(id){
 const r=requirements.find(x=>x.id===id);if(!r)return;
 r.status=r.status==="completed"?"pending":"completed";
 persist();render();
}
function removeItem(type,id){
 if(type==="grant"){
 const related=budgetLines.some(l=>l.grantId===id)||expenses.some(e=>e.grantId===id)||requirements.some(r=>r.grantId===id);
 if(related){notify(t("grantError"));return;}
 }
 if(!confirm(t("confirmDelete")))return;
 if(type==="grant")grants=grants.filter(x=>x.id!==id);
 if(type==="expense")expenses=expenses.filter(x=>x.id!==id);
 if(type==="requirement")requirements=requirements.filter(x=>x.id!==id);
 persist();render();
}
function persist(){
 try{
 localStorage.setItem("riskora_demo_v2",JSON.stringify({grants,expenses,requirements,budgetLines}));
 }catch(e){console.error(e);notify("La sauvegarde locale a échoué.");}
}
function load(){
 try{
 const raw=localStorage.getItem("riskora_demo_v2")||localStorage.getItem("riskora_demo");
 const d=JSON.parse(raw||"{}");
 grants=Array.isArray(d.grants)?d.grants:[];
 expenses=Array.isArray(d.expenses)?d.expenses:[];
 requirements=Array.isArray(d.requirements)?d.requirements:[];
 budgetLines=Array.isArray(d.budgetLines)?d.budgetLines:[];
 }catch(e){grants=[];expenses=[];requirements=[];budgetLines=[];}
}
function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"';}
function exportCSV(){
 const rows=[
 ["type","subvention","bailleur","date","categorie_ou_ligne","montant","devise","reference_ou_statut"]
 ];
 grants.forEach(g=>rows.push(["subvention",g.name,g.donor,"",g.project,g.amount,g.currency,g.status]));
 budgetLines.forEach(l=>rows.push(["budget",grantName(l.grantId),"","",l.name,l.amount,l.currency,""]));
 expenses.forEach(e=>rows.push(["depense",grantName(e.grantId),"",e.date,e.category,e.amount,grantCurrency(e.grantId),e.reference]));
 requirements.forEach(r=>rows.push(["conformite",grantName(r.grantId),"",r.due,r.name,"","",r.status]));
 const csv="\uFEFF"+rows.map(row=>row.map(csvCell).join(";")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="RISKORA_Export.csv";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function render(){
 document.documentElement.lang=lang;
 document.getElementById("langBtn").textContent=lang==="fr"?"EN":"FR";
 document.getElementById("tagline").textContent=lang==="fr"
 ?"GRANT CONTROL · Gestion des subventions":"GRANT CONTROL · Grant Management";
 nav();
 const pages={dashboard,grants:()=>grantPage(),budgets:budgetPage,expenses:expensePage,compliance:compliancePage};
 document.getElementById("main").innerHTML=
 `<div class="layout-buttons" style="justify-content:flex-end;margin-bottom:12px">
 <button onclick="exportCSV()">↓ ${t("export")}</button></div>`+pages[page]();
 if(page==="expenses"){
 document.getElementById("egrant")?.addEventListener("change",updateExpenseBudgetOptions);
 updateExpenseBudgetOptions();
 }
}
load();
render();
</script>
</body>
